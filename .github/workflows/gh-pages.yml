# Simple workflow for deploying static content to GitHub Pages
name: Deploy Neops Documentation

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  schedule:
    - cron: '0 */3 * * *'  # Runs every 3 hours

  repository_dispatch:
    types: [ trigger ]  # You can specify a custom event type

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    # Narrower than the workflow-level set: the build job never publishes to
    # Pages and never mints an OIDC token, and NODE_AUTH_TOKEN is exported to
    # `npm ci` install scripts. Only the deploy job inherits pages/id-token write.
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          submodules: true  # Checkout submodules
          token: ${{ secrets.SUBMODULES_TOKEN }}  # Use the GitHub token for authentication
          fetch-depth: 0    # Ensure the full history is fetched (necessary for some workflows)

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Update documentation sources
        run: make update-submodules BRANCH=develop

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: docs/neops-web-client/.nvmrc
          cache: npm
          cache-dependency-path: docs/neops-web-client/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: '@zebbra'

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      - name: Build Project
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `make doc-build` must stay ahead of `npm ci`: MkDocs crawls docs/ as its
          # docs_dir, and `npm ci` materialises docs/neops-web-client/node_modules
          # inside it, so any doc-build after the install would publish the whole
          # dependency tree. The guards below keep that ordering enforced.
          # The card lab is copied in afterwards for a second reason: `make doc-build`
          # ends with clean_sites_directory.py, which strips everything from site/
          # except index.html and a few asset paths, so a doc-build run after the copy
          # would delete the lab's JS/CSS while leaving its index.html guard passing.
          if [ -e docs/neops-web-client/node_modules ]; then
            echo "docs/neops-web-client/node_modules already exists before the MkDocs build and would be crawled into the site" >&2
            exit 1
          fi

          make doc-build
          if ! npm ci --prefix docs/neops-web-client; then
            echo "npm ci failed. If the error above is a 401 or 403 from npm.pkg.github.com, the repository GITHUB_TOKEN cannot read @zebbra/ngx-neops-app-components: open that package in zebbra/neops-web-client and grant zebbra/neops read access under Package settings > Manage Actions access." >&2
            exit 1
          fi
          npm run --prefix docs/neops-web-client build:card-lab

          card_lab_version="$(node -p "require('./docs/neops-web-client/package.json').dependencies?.['@zebbra/ngx-neops-app-components'] ?? ''")"
          card_lab_semver='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?([+][0-9A-Za-z.-]+)?$'
          if [[ ! "${card_lab_version}" =~ $card_lab_semver ]]; then
            echo "expected an exact @zebbra/ngx-neops-app-components version in docs/neops-web-client/package.json, got '${card_lab_version}'" >&2
            exit 1
          fi

          card_lab_target="site/neops-web-client/docs/card-lab/${card_lab_version}"

          mkdir -p "${card_lab_target}"
          cp -R docs/neops-web-client/dist/card-lab/. "${card_lab_target}/"

          if [ ! -f "${card_lab_target}/index.html" ]; then
            echo "card lab entry point missing at ${card_lab_target}/index.html" >&2
            exit 1
          fi

          if ! card_lab_symlinks="$(find "${card_lab_target}" -type l -print)"; then
            echo "failed to scan ${card_lab_target} for symlinks" >&2
            exit 1
          fi
          if [ -n "${card_lab_symlinks}" ]; then
            echo "card lab contains symlinks:" >&2
            echo "${card_lab_symlinks}" >&2
            exit 1
          fi

          if ! site_node_modules="$(find site -type d -name node_modules -print -quit)"; then
            echo "failed to scan site for node_modules" >&2
            exit 1
          fi
          if [ -n "${site_node_modules}" ]; then
            echo "node_modules leaked into the published site at ${site_node_modules}" >&2
            exit 1
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: ./site

  # Single deploy job since we're just deploying
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: cname
        run: echo "docs.neops.io" > site/CNAME
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.SUBMODULES_TOKEN }}
          publish_dir: ./site  # Directory with the build artifacts
