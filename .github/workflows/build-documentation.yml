name: build-documentation.yml
on:
  push:
    branches:
      - develop
      - main
    tags:
      - '*'
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  build-documentation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true  # Checkout submodules
          token: ${{ secrets.SUBMODULES_TOKEN }}  # Use the GitHub token for authentication
          fetch-depth: 0    # Ensure the full history is fetched (necessary for some workflows)


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for documentation
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .make_scripts/mkdocs-documentation/Dockerfile
          build-contexts: git=.git
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  validate-card-lab:
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.SUBMODULES_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: python -m pip install uv

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: docs/neops-web-client/.nvmrc
          cache: npm
          cache-dependency-path: docs/neops-web-client/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: '@zebbra'

      - name: Build combined documentation and Card Lab artifact
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: utils/build_web_client_card_lab.sh
